<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/English_V2/">
    <title>오늘의 표현 - Improve English</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .source {
            font-size: 0.95em;
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .content {
            padding: 30px;
        }

        .article-info {
            background: #f8f9fa;
            border-left: 4px solid #f5576c;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .article-info h3 {
            color: #f5576c;
            margin-bottom: 5px;
        }

        .article-info p {
            color: #666;
            font-size: 0.95em;
        }

        .expressions-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .expression-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .expression-card:hover {
            border-color: #f5576c;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.1);
        }

        .main-expression {
            display: flex;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .expression-text {
            font-size: 1.8em;
            font-weight: bold;
            color: #f5576c;
            margin-right: 15px;
        }

        .expression-meaning {
            color: #666;
            font-size: 0.95em;
        }

        .expression-description {
            background: #fdf8f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 3px solid #f5576c;
        }

        .description-title {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 8px;
        }

        .description-text {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .expression-example {
            background: white;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .example-label {
            font-weight: bold;
            color: #f5576c;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .example-en {
            color: #333;
            font-style: italic;
            margin-bottom: 5px;
        }

        .example-ko {
            color: #999;
            font-size: 0.9em;
        }

        .similar-expressions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .similar-title {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 15px;
            font-size: 1.05em;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .similar-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #f5576c;
        }

        .similar-expression {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 8px;
            font-size: 1.05em;
        }

        .similar-meaning {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .difference {
            background: white;
            padding: 8px;
            border-radius: 3px;
            font-size: 0.85em;
            color: #555;
            line-height: 1.5;
        }

        .difference-label {
            font-weight: bold;
            color: #f5576c;
            font-size: 0.8em;
            margin-bottom: 3px;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .navigation {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-button {
            display: inline-block;
            padding: 12px 30px;
            margin: 0 10px;
            background: #f5576c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .nav-button:hover {
            background: #d63447;
        }

        @media (max-width: 768px) {
            .similar-grid {
                grid-template-columns: 1fr;
            }

            .expression-text {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 오늘의 표현</h1>
            <p>유사하지만 다른 표현들을 비교하며 배우세요</p>
            <div class="source">📚 Claude Generated</div>
        </div>

        <div class="content">
            <div class="article-info">
                <h3>오늘의 읽기 자료</h3>
                <p>The Benefits of Learning Multiple Languages</p>
            </div>

            <div class="expressions-list" id="expressionsList">
                <!-- 표현이 여기에 동적으로 생성됩니다 -->
            </div>

            <div class="navigation">
                <a href="today/words" class="nav-button">← 단어로</a>
                <a href="today/grammar" class="nav-button">문법 →</a>
            </div>
        </div>
    </div>

    <script>
        const expressionsData = [
  {
    "main": "more and more people",
    "meaning_ko": "점점 더 많은 사람들",
    "meaning_en": "an increasing number of people; used to show that a number is growing over time",
    "example_en": "More and more people are working from home these days.",
    "example_ko": "요즘 점점 더 많은 사람들이 재택근무를 하고 있다.",
    "similar": [
      {
        "expression": "an increasing number of people",
        "meaning_ko": "점점 늘어나는 수의 사람들",
        "difference": "더 격식적이고 글이나 보고서에서 주로 쓰임"
      },
      {
        "expression": "a growing number of people",
        "meaning_ko": "늘어나는 수의 사람들",
        "difference": "뉴스나 기사체에서 자주 쓰이며 '증가 추세'를 강조함"
      },
      {
        "expression": "fewer and fewer people",
        "meaning_ko": "점점 더 적은 사람들",
        "difference": "같은 구조의 반대 의미 표현"
      }
    ]
  },
  {
    "main": "go far beyond",
    "meaning_ko": "~을 훨씬 넘어서다, ~ 이상이다",
    "meaning_en": "to be much greater or more important than something",
    "example_en": "The value of volunteering goes far beyond helping others.",
    "example_ko": "자원봉사의 가치는 남을 돕는 것을 훨씬 넘어선다.",
    "similar": [
      {
        "expression": "be more than just",
        "meaning_ko": "단순히 ~ 이상이다",
        "difference": "더 구어적이고 쉬운 표현으로 일상 대화에서 자주 씀"
      },
      {
        "expression": "extend beyond",
        "meaning_ko": "~을 넘어 확장되다",
        "difference": "범위가 넓어진다는 사실에 초점을 두며 'far'의 강조가 없음"
      }
    ]
  },
  {
    "main": "whatever the reason",
    "meaning_ko": "이유가 무엇이든 간에",
    "meaning_en": "no matter what the reason is; used before stating something that is true in any case",
    "example_en": "Whatever the reason, he should have called us first.",
    "example_ko": "이유가 무엇이든, 그는 먼저 우리에게 전화했어야 했다.",
    "similar": [
      {
        "expression": "for whatever reason",
        "meaning_ko": "무슨 이유에서인지",
        "difference": "이유를 모르거나 관심 없다는 뉘앙스로 문장 중간에도 자주 쓰임"
      },
      {
        "expression": "no matter why",
        "meaning_ko": "왜인지에 상관없이",
        "difference": "절 형태로 이어지며 더 구어적임"
      },
      {
        "expression": "regardless of the reason",
        "meaning_ko": "이유와 상관없이",
        "difference": "더 격식적이고 문어체에 가까움"
      }
    ]
  }
];
        const expressionsList = document.getElementById('expressionsList');

        if (expressionsData.length === 0) {
            expressionsList.innerHTML = '<div class="empty-message">오늘의 표현이 준비되지 않았습니다. 잠시 후 다시 시도해주세요.</div>';
        } else {
            expressionsData.forEach((expr, index) => {
                const card = document.createElement('div');
                card.className = 'expression-card';

                let html = `
                    <div class="main-expression">
                        <div class="expression-text">"${expr.main}"</div>
                    </div>

                    <div class="expression-description">
                        <div class="description-title">뜻</div>
                        <div class="description-text">${expr.meaning_ko}</div>
                        <div class="description-text" style="margin-top: 5px; font-size: 0.9em; color: #999;">(${expr.meaning_en})</div>
                    </div>

                    <div class="expression-example">
                        <div class="example-label">예시</div>
                        <div class="example-en">"${expr.example_en}"</div>
                        <div class="example-ko">${expr.example_ko}</div>
                    </div>
                `;

                // 유사 표현
                if (expr.similar && expr.similar.length > 0) {
                    html += `
                        <div class="similar-expressions">
                            <div class="similar-title">📌 유사 표현과의 차이</div>
                            <div class="similar-grid">
                    `;

                    expr.similar.forEach(sim => {
                        html += `
                            <div class="similar-box">
                                <div class="similar-expression">"${sim.expression}"</div>
                                <div class="similar-meaning">${sim.meaning_ko}</div>
                                <div class="difference">
                                    <div class="difference-label">차이점:</div>
                                    ${sim.difference}
                                </div>
                                <div class="example-en" style="margin-top: 8px; font-size: 0.85em;">"${sim.example_en}"</div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = html;
                expressionsList.appendChild(card);
            });
        }
    </script>
</body>
</html>
