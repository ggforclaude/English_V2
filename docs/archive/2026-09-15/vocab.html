<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/English_V2/">
    <title>오늘의 표현 - Improve English</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .source {
            font-size: 0.95em;
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .content {
            padding: 30px;
        }

        .article-info {
            background: #f8f9fa;
            border-left: 4px solid #f5576c;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .article-info h3 {
            color: #f5576c;
            margin-bottom: 5px;
        }

        .article-info p {
            color: #666;
            font-size: 0.95em;
        }

        .expressions-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .expression-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .expression-card:hover {
            border-color: #f5576c;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.1);
        }

        .main-expression {
            display: flex;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .expression-text {
            font-size: 1.8em;
            font-weight: bold;
            color: #f5576c;
            margin-right: 15px;
        }

        .expression-meaning {
            color: #666;
            font-size: 0.95em;
        }

        .expression-description {
            background: #fdf8f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 3px solid #f5576c;
        }

        .description-title {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 8px;
        }

        .description-text {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .expression-example {
            background: white;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .example-label {
            font-weight: bold;
            color: #f5576c;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .example-en {
            color: #333;
            font-style: italic;
            margin-bottom: 5px;
        }

        .example-ko {
            color: #999;
            font-size: 0.9em;
        }

        .similar-expressions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .similar-title {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 15px;
            font-size: 1.05em;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .similar-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #f5576c;
        }

        .similar-expression {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 8px;
            font-size: 1.05em;
        }

        .similar-meaning {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .difference {
            background: white;
            padding: 8px;
            border-radius: 3px;
            font-size: 0.85em;
            color: #555;
            line-height: 1.5;
        }

        .difference-label {
            font-weight: bold;
            color: #f5576c;
            font-size: 0.8em;
            margin-bottom: 3px;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .navigation {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-button {
            display: inline-block;
            padding: 12px 30px;
            margin: 0 10px;
            background: #f5576c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .nav-button:hover {
            background: #d63447;
        }

        @media (max-width: 768px) {
            .similar-grid {
                grid-template-columns: 1fr;
            }

            .expression-text {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 오늘의 표현</h1>
            <p>유사하지만 다른 표현들을 비교하며 배우세요</p>
            <div class="source">📚 Claude Generated</div>
        </div>

        <div class="content">
            <div class="article-info">
                <h3>오늘의 읽기 자료</h3>
                <p>The Benefits of Learning Multiple Languages</p>
            </div>

            <div class="expressions-list" id="expressionsList">
                <!-- 표현이 여기에 동적으로 생성됩니다 -->
            </div>

            <div class="navigation">
                <a href="today/words" class="nav-button">← 단어로</a>
                <a href="today/grammar" class="nav-button">문법 →</a>
            </div>
        </div>
    </div>

    <script>
        const expressionsData = [
  {
    "main": "more and more people",
    "meaning_ko": "점점 더 많은 사람들",
    "meaning_en": "an increasing number of people; used to show that a number is growing over time",
    "example_en": "More and more people are working from home these days.",
    "example_ko": "요즘 점점 더 많은 사람들이 재택근무를 하고 있다.",
    "similar": [
      {
        "expression": "an increasing number of people",
        "meaning_ko": "증가하는 수의 사람들",
        "difference": "같은 의미이지만 격식체이며 보고서나 학술 글쓰기에 더 적합하다"
      },
      {
        "expression": "a growing number of people",
        "meaning_ko": "점점 늘어나는 사람들",
        "difference": "역시 격식체 표현으로, 'more and more'보다 문어적이고 신문 기사에 자주 쓰인다"
      },
      {
        "expression": "fewer and fewer people",
        "meaning_ko": "점점 더 적은 사람들",
        "difference": "반대 의미로 감소 추세를 나타낼 때 사용한다"
      }
    ]
  },
  {
    "main": "Whatever the reason",
    "meaning_ko": "이유가 무엇이든 (간에)",
    "meaning_en": "no matter what the cause or motivation is; used to move on to a main point after mentioning several possible reasons",
    "example_en": "Whatever the reason, she never replied to my message.",
    "example_ko": "이유가 무엇이든, 그녀는 내 메시지에 답하지 않았다.",
    "similar": [
      {
        "expression": "whatever the reason is",
        "meaning_ko": "이유가 무엇이든",
        "difference": "be동사를 생략하지 않은 완전한 절 형태로, 말할 때 더 자연스럽다"
      },
      {
        "expression": "for whatever reason",
        "meaning_ko": "어떤 이유에서인지",
        "difference": "이유를 모르거나 이해할 수 없다는 뉘앙스가 강하며, 약간 부정적인 느낌을 줄 수 있다"
      },
      {
        "expression": "regardless of the reason",
        "meaning_ko": "이유와 관계없이",
        "difference": "더 격식체이고 단호한 어조로, 이유를 아예 고려하지 않겠다는 의미가 강하다"
      }
    ]
  },
  {
    "main": "not only A; (but) also B",
    "meaning_ko": "A뿐만 아니라 B도",
    "meaning_en": "used to add a second, often more important, piece of information to the first one",
    "example_en": "The new job is not only better paid; it also gives me more free time.",
    "example_ko": "새 직장은 급여가 더 좋을 뿐만 아니라 자유 시간도 더 많이 준다.",
    "similar": [
      {
        "expression": "as well as",
        "meaning_ko": "~뿐만 아니라, ~와 더불어",
        "difference": "한 문장 안에서 두 요소를 간단히 연결할 때 쓰며, 'not only'보다 강조가 약하다"
      },
      {
        "expression": "besides / in addition to",
        "meaning_ko": "~외에도, ~에 더하여",
        "difference": "추가 정보를 덧붙이는 전치사 표현으로, 뒤에 명사나 -ing형이 오고 대조의 강조 효과는 없다"
      },
      {
        "expression": "Not only did she..., but she also...",
        "meaning_ko": "그녀는 ~했을 뿐만 아니라 ~까지 했다",
        "difference": "문장 맨 앞에 쓰면 도치가 필요하며 훨씬 더 강한 강조와 격식체 느낌을 준다"
      }
    ]
  }
];
        const expressionsList = document.getElementById('expressionsList');

        if (expressionsData.length === 0) {
            expressionsList.innerHTML = '<div class="empty-message">오늘의 표현이 준비되지 않았습니다. 잠시 후 다시 시도해주세요.</div>';
        } else {
            expressionsData.forEach((expr, index) => {
                const card = document.createElement('div');
                card.className = 'expression-card';

                let html = `
                    <div class="main-expression">
                        <div class="expression-text">"${expr.main}"</div>
                    </div>

                    <div class="expression-description">
                        <div class="description-title">뜻</div>
                        <div class="description-text">${expr.meaning_ko}</div>
                        <div class="description-text" style="margin-top: 5px; font-size: 0.9em; color: #999;">(${expr.meaning_en})</div>
                    </div>

                    <div class="expression-example">
                        <div class="example-label">예시</div>
                        <div class="example-en">"${expr.example_en}"</div>
                        <div class="example-ko">${expr.example_ko}</div>
                    </div>
                `;

                // 유사 표현
                if (expr.similar && expr.similar.length > 0) {
                    html += `
                        <div class="similar-expressions">
                            <div class="similar-title">📌 유사 표현과의 차이</div>
                            <div class="similar-grid">
                    `;

                    expr.similar.forEach(sim => {
                        html += `
                            <div class="similar-box">
                                <div class="similar-expression">"${sim.expression}"</div>
                                <div class="similar-meaning">${sim.meaning_ko}</div>
                                <div class="difference">
                                    <div class="difference-label">차이점:</div>
                                    ${sim.difference}
                                </div>
                                <div class="example-en" style="margin-top: 8px; font-size: 0.85em;">"${sim.example_en}"</div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = html;
                expressionsList.appendChild(card);
            });
        }
    </script>
</body>
</html>
