<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/English_V2/">
    <title>오늘의 10개 단어 - Improve English</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .date {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 10px;
        }

        /* 탭 시스템 */
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            padding: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn:hover {
            background: #f0f0f0;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 학습 탭 스타일 */
        .words-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .word-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 150px;
            display: flex;
            flex-direction: column;
        }

        .word-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .word-card.flipped {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .word-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .word-card.flipped .word-title {
            color: white;
        }

        .word-pronunciation {
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 10px;
            font-style: italic;
        }

        .word-card.flipped .word-pronunciation {
            color: rgba(255,255,255,0.8);
        }

        .word-pos {
            display: inline-block;
            background: #e7f3ff;
            color: #0066cc;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 10px;
            width: fit-content;
        }

        .word-card.flipped .word-pos {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .word-meaning-ko {
            font-size: 1.1em;
            color: #e74c3c;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .word-card.flipped .word-meaning-ko {
            color: #ffebee;
        }

        .word-definition {
            font-size: 0.95em;
            color: #555;
            margin-bottom: 10px;
            flex-grow: 1;
        }

        .word-card.flipped .word-definition {
            color: rgba(255,255,255,0.9);
        }

        .word-example {
            background: white;
            padding: 10px;
            border-left: 3px solid #667eea;
            font-size: 0.9em;
            color: #666;
            font-style: italic;
            margin-top: auto;
        }

        .word-card.flipped .word-example {
            background: rgba(255,255,255,0.1);
            border-left-color: white;
            color: rgba(255,255,255,0.9);
        }

        .hint {
            font-size: 0.8em;
            color: #999;
            text-align: center;
            margin-top: 10px;
        }

        .word-card.flipped .hint {
            color: rgba(255,255,255,0.6);
        }

        /* 퀴즈 탭 스타일 */
        .quiz-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-question {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .question-type {
            font-size: 0.9em;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 5px;
        }

        .answer-input {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-check {
            background: #667eea;
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-check:hover {
            background: #764ba2;
        }

        .btn-next {
            background: #e9ecef;
            color: #333;
            width: 100%;
        }

        .btn-next:hover {
            background: #dee2e6;
        }

        .result {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .result.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .navigation {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-button {
            display: inline-block;
            padding: 12px 30px;
            margin: 0 10px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .nav-button:hover {
            background: #764ba2;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-direction: column;
            }

            .tab-btn {
                border-right: 3px solid transparent;
                border-bottom: none;
            }

            .tab-btn.active {
                border-right-color: #667eea;
                border-bottom-color: transparent;
            }

            .words-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 오늘의 10개 단어</h1>
            <p>단어를 배우고 퀴즈로 확인하세요</p>
            <div class="date">2026년 09월 04일</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'study')">📚 학습</button>
            <button class="tab-btn" onclick="switchTab(event, 'quiz')">❓ 퀴즈</button>
        </div>

        <div class="content">
            <!-- 학습 탭 -->
            <div id="study" class="tab-content active">
                <div class="progress">
                    <p>학습 진행도: <span id="learned">0</span> / 10</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress"></div>
                    </div>
                </div>

                <div class="words-grid" id="wordsGrid">
                    <!-- 카드가 여기에 동적으로 생성됩니다 -->
                </div>
            </div>

            <!-- 퀴즈 탭 -->
            <div id="quiz" class="tab-content">
                <div class="quiz-header">
                    <h2>단어 암기 퀴즈</h2>
                    <p>배운 단어를 확인해보세요</p>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-number" id="correctCount">0</div>
                        <div class="stat-label">정답</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">총 문제</div>
                    </div>
                </div>

                <div class="progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="quizProgress" style="width: 0%"></div>
                    </div>
                </div>

                <div class="quiz-container">
                    <div class="quiz-question" id="quizArea">
                        <!-- 퀴즈 콘텐츠가 여기에 생성됩니다 -->
                    </div>
                </div>
            </div>

            <div class="navigation">
                <a href="today" class="nav-button">← 대시보드</a>
                <a href="today/vocab" class="nav-button">어휘 →</a>
            </div>
        </div>
    </div>

    <script>
        const wordsData = [
  {
    "word": "chore",
    "pronunciation": "/tʃɔːr/",
    "pos": "noun",
    "meaning_en": "a small job that you have to do regularly at home",
    "meaning_ko": "집안일, 허드렛일",
    "example_en": "Washing the dishes is my least favorite chore."
  },
  {
    "word": "tidy",
    "pronunciation": "/ˈtaɪdi/",
    "pos": "verb",
    "meaning_en": "to make a place clean and neat by putting things in the right place",
    "meaning_ko": "정리하다, 치우다",
    "example_en": "I need to tidy my room before my friends arrive."
  },
  {
    "word": "errand",
    "pronunciation": "/ˈerənd/",
    "pos": "noun",
    "meaning_en": "a short trip to do something useful, such as buying or delivering something",
    "meaning_ko": "심부름, 볼일",
    "example_en": "I have a few errands to run this afternoon."
  },
  {
    "word": "commute",
    "pronunciation": "/kəˈmjuːt/",
    "pos": "verb",
    "meaning_en": "to travel regularly between your home and your workplace or school",
    "meaning_ko": "통근하다, 통학하다",
    "example_en": "She commutes to the office by subway every morning."
  },
  {
    "word": "leftovers",
    "pronunciation": "/ˈleftəʊvəz/",
    "pos": "noun",
    "meaning_en": "food that has not been eaten at the end of a meal",
    "meaning_ko": "남은 음식",
    "example_en": "We put the leftovers in the fridge for tomorrow."
  },
  {
    "word": "exhausted",
    "pronunciation": "/ɪɡˈzɔːstɪd/",
    "pos": "adjective",
    "meaning_en": "extremely tired after working or doing something hard",
    "meaning_ko": "기진맥진한, 매우 지친",
    "example_en": "I was exhausted after cleaning the house all day."
  },
  {
    "word": "occasionally",
    "pronunciation": "/əˈkeɪʒənəli/",
    "pos": "adverb",
    "meaning_en": "sometimes, but not often",
    "meaning_ko": "가끔, 때때로",
    "example_en": "We occasionally eat out on weekends."
  },
  {
    "word": "routine",
    "pronunciation": "/ruːˈtiːn/",
    "pos": "noun",
    "meaning_en": "the usual order in which you do things every day",
    "meaning_ko": "일과, 규칙적인 일상",
    "example_en": "Going for a walk after dinner is part of my daily routine."
  },
  {
    "word": "borrow",
    "pronunciation": "/ˈbɒrəʊ/",
    "pos": "verb",
    "meaning_en": "to take and use something that belongs to someone else and give it back later",
    "meaning_ko": "빌리다",
    "example_en": "Can I borrow your umbrella until tomorrow?"
  },
  {
    "word": "convenient",
    "pronunciation": "/kənˈviːniənt/",
    "pos": "adjective",
    "meaning_en": "useful, easy, or suitable for a particular purpose or situation",
    "meaning_ko": "편리한, 알맞은",
    "example_en": "My apartment is convenient because the bus stop is right outside."
  }
];
        const learned = new Set();
        let quizState = {
            currentIndex: 0,
            answers: {},
            correctCount: 0,
            totalCount: 0
        };

        // 탭 전환
        function switchTab(event, tabName) {
            // 모든 탭 비활성화
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(tab => tab.classList.remove('active'));

            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => btn.classList.remove('active'));

            // 선택된 탭 활성화
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // 퀴즈 탭이면 초기화
            if (tabName === 'quiz') {
                initQuiz();
            }
        }

        // 학습 탭: 카드 생성
        const grid = document.getElementById('wordsGrid');
        wordsData.forEach((word, index) => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `
                <div class="word-title">${word.word}</div>
                <div class="word-pronunciation">${word.pronunciation || 'N/A'}</div>
                ${word.pos ? `<div class="word-pos">${word.pos}</div>` : ''}
                <div class="word-meaning-ko"><strong>한글:</strong> ${word.meaning_ko || '(뜻 없음)'}</div>
                <div class="word-definition"><strong>영어:</strong> ${word.meaning_en || '(정의 없음)'}</div>
                ${word.example_en ? `<div class="word-example">"${word.example_en}"</div>` : ''}
                <div class="hint">클릭해서 다시 보기</div>
            `;

            card.addEventListener('click', function() {
                this.classList.toggle('flipped');
                if (this.classList.contains('flipped')) {
                    learned.add(index);
                } else {
                    learned.delete(index);
                }
                updateProgress();
            });

            grid.appendChild(card);
        });

        function updateProgress() {
            document.getElementById('learned').textContent = learned.size;
            const percent = (learned.size / wordsData.length) * 100;
            document.getElementById('progress').style.width = percent + '%';
            localStorage.setItem('wordsLearned_' + new Date().toISOString().split('T')[0], JSON.stringify(Array.from(learned)));
        }

        // 퀴즈 탭
        function initQuiz() {
            quizState.currentIndex = 0;
            quizState.answers = {};
            quizState.correctCount = 0;
            quizState.totalCount = wordsData.length;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('totalCount').textContent = wordsData.length;
            showQuizQuestion();
        }

        function showQuizQuestion() {
            if (quizState.currentIndex >= wordsData.length) {
                showQuizResult();
                return;
            }

            const word = wordsData[quizState.currentIndex];
            const questionType = quizState.currentIndex % 2 === 0 ? 'en-to-ko' : 'ko-to-en';

            let questionHTML = `
                <div class="question-type">
                    문제 ${quizState.currentIndex + 1} / ${wordsData.length}
                </div>
            `;

            if (questionType === 'en-to-ko') {
                questionHTML += `
                    <div class="question-text">"${word.word}"의 한글 뜻은?</div>
                    <input type="text" class="answer-input" id="answerInput" placeholder="한글 뜻을 입력하세요" autofocus>
                `;
            } else {
                questionHTML += `
                    <div class="question-text">"${word.meaning_ko || word.meaning_en}"의 영단어는?</div>
                    <input type="text" class="answer-input" id="answerInput" placeholder="영단어를 입력하세요" autofocus>
                `;
            }

            questionHTML += `
                <button class="btn btn-check" onclick="checkAnswer('${questionType}')">정답 확인</button>
                <div id="resultArea"></div>
            `;

            document.getElementById('quizArea').innerHTML = questionHTML;

            const progress = ((quizState.currentIndex + 1) / wordsData.length) * 100;
            document.getElementById('quizProgress').style.width = progress + '%';

            // Enter 키로 제출
            document.getElementById('answerInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkAnswer(questionType);
                }
            });
        }

        function checkAnswer(questionType) {
            const word = wordsData[quizState.currentIndex];
            const userAnswer = document.getElementById('answerInput').value.toLowerCase().replace(/\s+/g, ' ').trim();
            let isCorrect = false;

            if (questionType === 'en-to-ko') {
                const correctAnswers = [word.meaning_ko, word.meaning_en].map(a => a.toLowerCase().replace(/\s+/g, ' ').trim());
                isCorrect = correctAnswers.some(ans => ans.includes(userAnswer) || userAnswer.includes(ans));
            } else {
                const normalizedWord = word.word.toLowerCase().replace(/\s+/g, ' ').trim();
                isCorrect = normalizedWord === userAnswer;
            }

            if (isCorrect) {
                quizState.correctCount++;
                document.getElementById('correctCount').textContent = quizState.correctCount;
            }

            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = `
                <div class="result ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? '✓ 정답입니다!' : '✗ 틀렸습니다'}
                </div>
                <div style="margin-bottom: 15px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
                    <strong>정답:</strong> ${questionType === 'en-to-ko' ? word.meaning_ko : word.word}
                </div>
                <button class="btn btn-next" onclick="nextQuestion()">다음 문제</button>
            `;

            quizState.answers[quizState.currentIndex] = isCorrect;
        }

        function nextQuestion() {
            quizState.currentIndex++;
            showQuizQuestion();
        }

        function showQuizResult() {
            const accuracy = Math.round((quizState.correctCount / quizState.totalCount) * 100);
            const resultHTML = `
                <div style="text-align: center; padding: 30px;">
                    <h2>퀴즈 완료!</h2>
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-number">${quizState.correctCount}</div>
                            <div class="stat-label">정답</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${accuracy}%</div>
                            <div class="stat-label">정확도</div>
                        </div>
                    </div>
                    <button class="btn btn-check" onclick="initQuiz()">다시 풀기</button>
                </div>
            `;
            document.getElementById('quizArea').innerHTML = resultHTML;
        }

        // 초기 진도 로드
        window.addEventListener('load', updateProgress);
    </script>
</body>
</html>
