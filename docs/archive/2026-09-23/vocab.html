<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/English_V2/">
    <title>오늘의 표현 - Improve English</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .source {
            font-size: 0.95em;
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .content {
            padding: 30px;
        }

        .article-info {
            background: #f8f9fa;
            border-left: 4px solid #f5576c;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        .article-info h3 {
            color: #f5576c;
            margin-bottom: 5px;
        }

        .article-info p {
            color: #666;
            font-size: 0.95em;
        }

        .expressions-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .expression-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .expression-card:hover {
            border-color: #f5576c;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.1);
        }

        .main-expression {
            display: flex;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .expression-text {
            font-size: 1.8em;
            font-weight: bold;
            color: #f5576c;
            margin-right: 15px;
        }

        .expression-meaning {
            color: #666;
            font-size: 0.95em;
        }

        .expression-description {
            background: #fdf8f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 3px solid #f5576c;
        }

        .description-title {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 8px;
        }

        .description-text {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .expression-example {
            background: white;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .example-label {
            font-weight: bold;
            color: #f5576c;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .example-en {
            color: #333;
            font-style: italic;
            margin-bottom: 5px;
        }

        .example-ko {
            color: #999;
            font-size: 0.9em;
        }

        .similar-expressions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .similar-title {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 15px;
            font-size: 1.05em;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .similar-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #f5576c;
        }

        .similar-expression {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 8px;
            font-size: 1.05em;
        }

        .similar-meaning {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .difference {
            background: white;
            padding: 8px;
            border-radius: 3px;
            font-size: 0.85em;
            color: #555;
            line-height: 1.5;
        }

        .difference-label {
            font-weight: bold;
            color: #f5576c;
            font-size: 0.8em;
            margin-bottom: 3px;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .navigation {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-button {
            display: inline-block;
            padding: 12px 30px;
            margin: 0 10px;
            background: #f5576c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .nav-button:hover {
            background: #d63447;
        }

        @media (max-width: 768px) {
            .similar-grid {
                grid-template-columns: 1fr;
            }

            .expression-text {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 오늘의 표현</h1>
            <p>유사하지만 다른 표현들을 비교하며 배우세요</p>
            <div class="source">📚 Claude Generated</div>
        </div>

        <div class="content">
            <div class="article-info">
                <h3>오늘의 읽기 자료</h3>
                <p>The Benefits of Learning Multiple Languages</p>
            </div>

            <div class="expressions-list" id="expressionsList">
                <!-- 표현이 여기에 동적으로 생성됩니다 -->
            </div>

            <div class="navigation">
                <a href="today/words" class="nav-button">← 단어로</a>
                <a href="today/grammar" class="nav-button">문법 →</a>
            </div>
        </div>
    </div>

    <script>
        const expressionsData = [
  {
    "main": "go far beyond",
    "meaning_ko": "~을 훨씬 넘어서다, ~보다 훨씬 더하다",
    "meaning_en": "to be much greater or more important than something; to extend well past a certain limit",
    "example_en": "The benefits of exercise go far beyond losing weight.",
    "example_ko": "운동의 이점은 체중 감량을 훨씬 넘어선다.",
    "similar": [
      {
        "expression": "be more than just",
        "meaning_ko": "단순히 ~ 이상이다",
        "difference": "go far beyond보다 일상적이고 부드러운 표현으로, '훨씬'이라는 강조의 정도가 약하다"
      },
      {
        "expression": "exceed",
        "meaning_ko": "초과하다, 넘어서다",
        "difference": "수치나 한도를 넘는다는 격식체 단어로, 추상적 가치보다 측정 가능한 양에 주로 쓰인다"
      }
    ]
  },
  {
    "main": "whatever the reason",
    "meaning_ko": "이유가 무엇이든 간에",
    "meaning_en": "no matter what the cause or motivation is",
    "example_en": "Whatever the reason, she never explained why she left so suddenly.",
    "example_ko": "이유가 무엇이든 간에, 그녀는 왜 그렇게 갑자기 떠났는지 설명하지 않았다.",
    "similar": [
      {
        "expression": "for whatever reason",
        "meaning_ko": "무슨 이유에서인지",
        "difference": "이유를 모르거나 이해할 수 없다는 뉘앙스가 강하며, 종종 약간의 불만이나 의아함을 담는다"
      },
      {
        "expression": "regardless of the reason",
        "meaning_ko": "이유와 상관없이",
        "difference": "더 격식 있고 단정적인 표현으로, 이유를 고려하지 않겠다는 태도가 분명하다"
      }
    ]
  },
  {
    "main": "the way we think",
    "meaning_ko": "우리가 생각하는 방식",
    "meaning_en": "the manner or style in which people think; used with 'the way + subject + verb'",
    "example_en": "Traveling abroad completely changed the way I see the world.",
    "example_ko": "해외여행은 내가 세상을 보는 방식을 완전히 바꿔놓았다.",
    "similar": [
      {
        "expression": "how we think",
        "meaning_ko": "우리가 어떻게 생각하는지",
        "difference": "의미는 비슷하지만 더 구어적이며, 명사구보다 의문의 뉘앙스가 살짝 남아 있다"
      },
      {
        "expression": "our way of thinking",
        "meaning_ko": "우리의 사고방식",
        "difference": "명사구 형태로 굳어진 표현이라 개인이나 집단의 고정된 관점을 가리킬 때 쓰인다"
      }
    ]
  }
];
        const expressionsList = document.getElementById('expressionsList');

        if (expressionsData.length === 0) {
            expressionsList.innerHTML = '<div class="empty-message">오늘의 표현이 준비되지 않았습니다. 잠시 후 다시 시도해주세요.</div>';
        } else {
            expressionsData.forEach((expr, index) => {
                const card = document.createElement('div');
                card.className = 'expression-card';

                let html = `
                    <div class="main-expression">
                        <div class="expression-text">"${expr.main}"</div>
                    </div>

                    <div class="expression-description">
                        <div class="description-title">뜻</div>
                        <div class="description-text">${expr.meaning_ko}</div>
                        <div class="description-text" style="margin-top: 5px; font-size: 0.9em; color: #999;">(${expr.meaning_en})</div>
                    </div>

                    <div class="expression-example">
                        <div class="example-label">예시</div>
                        <div class="example-en">"${expr.example_en}"</div>
                        <div class="example-ko">${expr.example_ko}</div>
                    </div>
                `;

                // 유사 표현
                if (expr.similar && expr.similar.length > 0) {
                    html += `
                        <div class="similar-expressions">
                            <div class="similar-title">📌 유사 표현과의 차이</div>
                            <div class="similar-grid">
                    `;

                    expr.similar.forEach(sim => {
                        html += `
                            <div class="similar-box">
                                <div class="similar-expression">"${sim.expression}"</div>
                                <div class="similar-meaning">${sim.meaning_ko}</div>
                                <div class="difference">
                                    <div class="difference-label">차이점:</div>
                                    ${sim.difference}
                                </div>
                                <div class="example-en" style="margin-top: 8px; font-size: 0.85em;">"${sim.example_en}"</div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = html;
                expressionsList.appendChild(card);
            });
        }
    </script>
</body>
</html>
