<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 학습 리포트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            margin-top: 10px;
            opacity: 0.9;
        }

        .report-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .report-section h2 {
            color: #667eea;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .weak-area-card, .supplemental-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .weak-area-card h3, .supplemental-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .weak-area-card h4, .supplemental-card h4 {
            color: #764ba2;
            margin: 10px 0 5px 0;
        }

        .practice-questions {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
        }

        .q {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .q:last-child {
            border-bottom: none;
        }

        .q p {
            margin: 5px 0;
            line-height: 1.6;
        }

        details {
            cursor: pointer;
            margin-top: 10px;
        }

        details summary {
            color: #667eea;
            font-weight: bold;
            padding: 10px;
            background: #f0f4ff;
            border-radius: 4px;
        }

        details summary:hover {
            background: #e0ebff;
        }

        .back-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .back-link:hover {
            background: #764ba2;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/today" class="back-link">← 돌아가기</a>

        <header>
            <h1>📊 영어 학습 리포트</h1>
            <p>생성 시간: </p>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number">0%</div>
                    <div class="stat-label">정확도</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">0</div>
                    <div class="stat-label">학습일수</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">0</div>
                    <div class="stat-label">풀이한 문제</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">no_data</div>
                    <div class="stat-label">학습 추세</div>
                </div>
            </div>
        </header>

        <div class="report-section">
            <h2>⚠️ 약점 분석</h2>
            <p>약점 데이터가 없습니다.</p>
        </div>

        <div class="report-section">
            <h2>📚 보충 학습 자료</h2>
            <p>보충 자료 생성 중입니다.</p>
        </div>

        <div class="report-section">
            <h2>🎯 다음 단계</h2>
            <p><strong>우선 집중 영역:</strong> 전체적인 기초 다지기</p>
            <p style="margin-top: 15px; color: #666;">
                위의 보충 학습 자료를 참고하여 약점을 극복해보세요.
                매일의 학습을 통해 지속적으로 개선될 것입니다.
            </p>
        </div>
    </div>
</body>
</html>
